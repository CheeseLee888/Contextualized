---
name: Build & Deploy Website

'on':
  push:
    branches: ["main"]
    paths:
      - 'site-src/**'
      - '.github/workflows/publish-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Ensure Bundler 2.5.7
        working-directory: site-src
        run: |
          gem install bundler:2.5.7
          bundle _2.5.7_ --version

      - name: Install Ruby gems
        working-directory: site-src
        run: |
          bundle _2.5.7_ config set path 'vendor/bundle'
          bundle _2.5.7_ install

      - name: Install Jupyter (for jekyll-jupyter-notebook)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install jupyter
          jupyter --version

      - name: Build Jekyll (al-folio)
        working-directory: site-src
        run: |
          JEKYLL_ENV=production \
            bundle _2.5.7_ exec jekyll build \
            -d ./_site \
            --trace --verbose

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-src/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
